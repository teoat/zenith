[pytest]
pythonpath = 
    .
    services
testpaths = 
    services
    tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=services
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=term
    --cov-fail-under=50
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    api: API related tests
    asyncio: mark a test as an asyncio-based test
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
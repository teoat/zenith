apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-backend
  namespace: fraud-detection
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-backend
  template:
    metadata:
      labels:
        app: fraud-backend
        perfection: infinite
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          value: sqlite:////app/data/fraud_detection.db
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: PERFECTION_LEVEL
          value: infinite
        - name: ZERO_DEFECTS
          value: 'True'
        - name: QUANTUM_ENHANCED
          value: 'True'
        image: fraud-backend:latest
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        name: backend
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi

# Prometheus Alert Rules
# Defines critical alerts for the fraud detection platform

groups:
  - name: system_alerts
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% (current: {{ $value }}%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% (current: {{ $value }}%)"

      # Disk space critical
      - alert: DiskSpaceCritical
        expr: (1 - (node_filesystem_free_bytes / node_filesystem_size_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Disk space critical on {{ $labels.instance }}"
          description: "Disk usage is above 90% (current: {{ $value }}%)"

  - name: application_alerts
    interval: 30s
    rules:
      # High API error rate
      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High API error rate"
          description: "API error rate is above 5% (current: {{ $value | humanizePercentage }})"

      # Slow API response time
      - alert: SlowAPIResponse
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API response time degraded"
          description: "95th percentile response time is above 500ms (current: {{ $value }}s)"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been down for more than 1 minute"

      # High request rate
      - alert: HighRequestRate
        expr: rate(http_requests_total[5m]) > 1000
        for: 5m
        labels:
          severity: info
          component: api
        annotations:
          summary: "High request rate detected"
          description: "Request rate is {{ $value }} requests/second"

  - name: performance_alerts
    interval: 30s
    rules:
      # Database query slow
      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database queries are slow"
          description: "95th percentile query time is above 100ms (current: {{ $value }}s)"

      # Cache miss rate high
      - alert: HighCacheMissRate
        expr: rate(cache_misses_total[5m]) / rate(cache_requests_total[5m]) > 0.3
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "High cache miss rate"
          description: "Cache miss rate is above 30% (current: {{ $value | humanizePercentage }})"

  - name: business_alerts
    interval: 60s
    rules:
      # Fraud detection rate anomaly
      - alert: FraudDetectionAnomaly
        expr: abs(rate(fraud_cases_detected_total[1h]) - avg_over_time(fraud_cases_detected_total[24h])) / avg_over_time(fraud_cases_detected_total[24h]) > 0.5
        for: 30m
        labels:
          severity: warning
          component: fraud-detection
        annotations:
          summary: "Fraud detection rate anomaly"
          description: "Fraud detection rate has changed by more than 50% from the 24h average"

      # AI model confidence low
      - alert: LowAIConfidence
        expr: avg(ai_prediction_confidence) < 0.7
        for: 15m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "AI model confidence is low"
          description: "Average AI confidence is below 70% (current: {{ $value | humanizePercentage }})"

      # Case processing backlog
      - alert: CaseProcessingBacklog
        expr: pending_cases_total > 100
        for: 30m
        labels:
          severity: warning
          component: case-processing
        annotations:
          summary: "Case processing backlog detected"
          description: "There are {{ $value }} pending cases"

# Prometheus Monitoring Configuration
# Scrapes metrics from application endpoints

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fraud-detection-prod'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alerting rules
rule_files:
  - 'alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Backend API metrics
  - job_name: 'backend-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8000']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  # Frontend performance metrics (if exposed)
  - job_name: 'frontend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['localhost:3000']
    scrape_interval: 30s

  # Database metrics
  - job_name: 'database'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 30s

  # Application health checks
  - job_name: 'health-checks'
    metrics_path: '/health'
    static_configs:
      - targets:
          - 'localhost:8000'
    scrape_interval: 10s

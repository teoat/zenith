# Production Monitoring and Alerting Configuration
# ================================================

# =============================================
# PROMETHEUS ALERTING RULES
# =============================================

groups:
  - name: fraud_detection_alerts
    rules:
      # Application Health
      - alert: FraudDetectionDown
        expr: up{job="fraud-detection"} == 0
        for: 5m
        labels:
          severity: critical
          service: fraud-detection
        annotations:
          summary: "Fraud Detection service is down"
          description: "Fraud Detection service has been down for more than 5 minutes"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          service: fraud-detection
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | printf \"%.2f\" }}% over the last 5 minutes"

      # Security Alerts
      - alert: FailedLoginAttemptsSpike
        expr: increase(login_failures_total[10m]) > 50
        for: 5m
        labels:
          severity: warning
          service: fraud-detection
        annotations:
          summary: "Spike in failed login attempts"
          description: "{{ $value }} failed login attempts in the last 10 minutes"

      - alert: SuspiciousTransactionSpike
        expr: increase(suspicious_transactions_total[10m]) > 100
        for: 5m
        labels:
          severity: warning
          service: fraud-detection
        annotations:
          summary: "Spike in suspicious transactions"
          description: "{{ $value }} suspicious transactions detected in the last 10 minutes"

      # Performance Alerts
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: fraud-detection
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / process_virtual_memory_max_bytes > 0.8
        for: 10m
        labels:
          severity: warning
          service: fraud-detection
        annotations:
          summary: "High memory usage"
          description: "Memory usage is at {{ $value | printf \"%.1f\" }}%"

      - alert: HighCPUUsage
        expr: rate(process_cpu_user_seconds_total[5m]) / 5 > 0.8
        for: 5m
        labels:
          severity: warning
          service: fraud-detection
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is at {{ $value | printf \"%.1f\" }}%"

      # Database Alerts
      - alert: DatabaseConnectionIssues
        expr: increase(database_connection_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Database connection issues"
          description: "{{ $value }} database connection errors in the last 5 minutes"

      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, rate(database_query_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Slow database queries detected"
          description: "95th percentile query time is {{ $value }}s"

      # Security Monitoring
      - alert: UnusualAccessPatterns
        expr: increase(unusual_access_patterns_total[10m]) > 20
        for: 5m
        labels:
          severity: warning
          service: fraud-detection
        annotations:
          summary: "Unusual access patterns detected"
          description: "{{ $value }} unusual access patterns in the last 10 minutes"

  - name: system_alerts
    rules:
      # System Health
      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Low disk space"
          description: "Disk usage is above 85%"

      - alert: HighSystemLoad
        expr: node_load5 > 4
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High system load"
          description: "System load is {{ $value }} (5-minute average)"

# =============================================
# ALERTING CONFIGURATION
# =============================================

# Email alerts
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Global alerting configuration
global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'fraud-detection-alerts@company.com'
  smtp_auth_username: 'fraud-detection-alerts@company.com'
  smtp_auth_password: 'SMTP_PASSWORD_PLACEHOLDER'

# Route configuration
route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'email-alerts'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
  - match:
      severity: warning
    receiver: 'warning-alerts'

receivers:
- name: 'email-alerts'
  email_configs:
  - to: 'team@company.com'
    headers:
      subject: '[Fraud Detection] {{ .GroupLabels.alertname }}'
    html: '{{ .CommonAnnotations.description }}'

- name: 'critical-alerts'
  email_configs:
  - to: 'oncall@company.com'
    headers:
      subject: '[CRITICAL] Fraud Detection Alert: {{ .GroupLabels.alertname }}'
  slack_configs:
  - api_url: 'SLACK_WEBHOOK_URL_PLACEHOLDER'
    channel: '#alerts-critical'
    title: '[CRITICAL] {{ .GroupLabels.alertname }}'
    text: '{{ .CommonAnnotations.description }}'

- name: 'warning-alerts'
  email_configs:
  - to: 'team@company.com'
    headers:
      subject: '[WARNING] Fraud Detection Alert: {{ .GroupLabels.alertname }}'
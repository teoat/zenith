version: '3.8'

services:
  backend:
    build: ./backend
    container_name: fraud-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/fraud_detection.db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
      # Fallback secrets for local dev
      - JWT_SECRET=docker-dev-secret-change-prod
      - ENCRYPTION_KEY=docker-dev-key-change-prod
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    depends_on:
      - redis
    # Override command for development to enable reload
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: fraud-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  redis:
    image: "redis:alpine"
    container_name: fraud-redis
    ports:
      - "6379:6379"

volumes:
  backend_data:

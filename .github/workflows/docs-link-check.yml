name: docs-link-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-link-check.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-link-check.yml'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check docs links
        uses: lycheeverse/lychee-action@v1.10.1
        with:
          args: --verbose --no-progress docs
          fail: true

name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Security Tools
        run: |
          pip install bandit safety

      - name: Run Bandit (SAST)
        # Skip B101 (assert used) as it's common in tests, but check main code
        run: |
          bandit -r backend/app backend/core -x tests -ll

      - name: Run Safety (Dependency Check)
        run: |
          safety check -r backend/requirements.txt --ignore 70612 # Ignore specific CVEs if needed
name: Database Migration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/alembic/**'
      - 'backend/app/db/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/alembic/**'
      - 'backend/app/db/**'

jobs:
  migration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic sqlalchemy
          pip install -r requirements.txt

      - name: Run migration test suite
        run: |
          python tests/migration/test_database_migrations.py \
            --backend-path backend \
            --output tests/migration/report.txt

      - name: Upload migration reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-reports-${{ github.run_number }}
          path: |
            tests/migration/
          retention-days: 30

      - name: Comment PR with migration results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (fs.existsSync('tests/migration/report.txt')) {
              const report = fs.readFileSync('tests/migration/report.txt', 'utf8');
              
              const comment = `## 🗄️  Database Migration Test Results\n\n\`\`\`\n${report}\n\`\`\`\n\n`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

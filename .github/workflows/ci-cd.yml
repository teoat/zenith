name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Scan
        run: bandit -r backend/ -f json -o security-scan.json

      - name: Check for high severity issues
        run: |
          if jq '.results[] | select(.issue_severity == "HIGH")' security-scan.json | jq -e 'length > 0'; then
            echo "❌ HIGH severity security issues found!"
            jq '.results[] | select(.issue_severity == "HIGH")' security-scan.json
            exit 1
          else
            echo "✅ No HIGH severity security issues found"
          fi

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: security-scan.json

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests with coverage
        run: |
          pytest --cov=backend/app --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run type checking
        working-directory: frontend
        run: npm run type-check

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Check Python dependencies
        run: |
          pip install pip-audit
          pip-audit --format json --output audit-results.json || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check Node.js dependencies
        working-directory: frontend
        run: npm audit --audit-level moderate

  performance-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run performance tests
        run: |
          python -c "
          from backend.app.performance import performance_test_fraud_engine
          results = performance_test_fraud_engine()
          print(f'Performance test results: {results}')
          if results['alerts_generated'] < 900:  # Expect most transactions to trigger alerts
            print('⚠️  Performance test may indicate issues')
          else:
            print('✅ Performance test passed')
          "

  deploy-check:
    runs-on: ubuntu-latest
    needs: [security-scan, backend-tests, frontend-lint, dependency-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy readiness check
        run: |
          echo "✅ All checks passed - ready for deployment"
          echo "Security: ✅ Clean"
          echo "Tests: ✅ Passing"
          echo "Linting: ✅ Clean"
          echo "Dependencies: ✅ Secure"
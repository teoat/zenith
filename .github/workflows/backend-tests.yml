name: Backend Tests & Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-xdist
      
      - name: Run linting
        run: |
          cd backend
          pip install flake8 black isort
          # Check code formatting
          black --check . || echo "Black formatting issues found"
          isort --check-only . || echo "Import sorting issues found"
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ -v \
            --cov=app \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -n auto
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-only
          JWT_SECRET_KEY: test-jwt-secret-for-ci-only

            CSRF_SECRET: test-csrf-secret-for-ci-only
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
      
      - name: Test backend import
        run: |
          cd backend
          python3 -c "from main import app; print(f'✅ Backend imports successfully - {len(app.routes)} routes')"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key
      
      - name: Security scan
        run: |
          cd backend
          pip install safety bandit
          # Check for known vulnerabilities in dependencies
          safety check --json || echo "Security issues found - review required"
          # Check for common security issues in code
          bandit -r app/ core/ -f json || echo "Bandit found potential security issues"
      
      - name: Python dependency audit (pip-audit)
        run: |
          cd backend
          pip install pip-audit
          pip-audit --json --output pip-audit-report.json || echo "pip-audit found vulnerabilities"
      
      - name: Test health endpoints
        run: |
          cd backend
          python3 -c "
from main import app
from fastapi.testclient import TestClient

client = TestClient(app)

# Test health endpoint
response = client.get('/health')
assert response.status_code == 200
assert 'status' in response.json()
print('✅ Health endpoint working')

# Test live endpoint
response = client.get('/health/live')
assert response.status_code == 200
print('✅ Liveness endpoint working')
          "
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          ENVIRONMENT: test

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build success notification
        run: |
          echo "✅ All tests passed!"
          echo "✅ Security scans complete!"
          echo "✅ Backend build successful!"
          echo "Ready for deployment to staging"

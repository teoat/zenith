name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          ruff check .
          mypy . --strict

      - name: Run tests
        run: pytest --cov=./backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  type-check:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vercel-edge/package-lock.json

      - name: Install dependencies
        working-directory: ./vercel-edge
        run: npm ci

      - name: Type check
        working-directory: ./vercel-edge
        run: npm run type-check

      - name: Lint
        working-directory: ./vercel-edge
        run: npm run lint

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Check Docker images
        run: |
          docker build -t zenith-api-gateway ./services/api-gateway
          docker build -t zenith-ai-ml ./services/ai-ml-service
          docker build -t zenith-fraud-intel ./services/fraud-intel-service
          docker build -t zenith-workflow ./services/workflow-regulatory-service

  build-railway:
    name: Build Railway Services
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-gateway
          push: false
          load: true
          tags: zenith-api-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI/ML Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/ai-ml-service
          push: false
          load: true
          tags: zenith-ai-ml:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Fraud+Intel Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/fraud-intel-service
          push: false
          load: true
          tags: zenith-fraud-intel:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Workflow+Reg Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/workflow-regulatory-service
          push: false
          load: true
          tags: zenith-workflow:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-vercel:
    name: Build Vercel Edge
    runs-on: ubuntu-latest
    needs: [type-check, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vercel-edge/package-lock.json

      - name: Install dependencies
        working-directory: ./vercel-edge
        run: npm ci

      - name: Build
        working-directory: ./vercel-edge
        run: npm run build

  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build-railway
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy API Gateway
        run: |
          cd services/api-gateway
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy AI/ML Service
        run: |
          cd services/ai-ml-service
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Fraud+Intel Service
        run: |
          cd services/fraud-intel-service
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Workflow+Reg Service
        run: |
          cd services/workflow-regulatory-service
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 30
          curl -f https://api-gateway.railway.app/health || exit 1
          curl -f https://ai-service.railway.app/health || exit 1
          curl -f https://fraud-service.railway.app/health || exit 1
          curl -f https://workflow-service.railway.app/health || exit 1
          echo "All services healthy!"

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-vercel
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Production
        working-directory: ./vercel-edge
        run: |
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          RAILWAY_API_GATEWAY_URL: ${{ secrets.RAILWAY_API_GATEWAY_URL }}

      - name: Health Check
        run: |
          curl -f https://vercel-edge-project.vercel.app/api/health || exit 1
          echo "Edge gateway healthy!"

  post-deploy:
    name: Post-Deployment
    runs-on: ubuntu-latest
    needs: [deploy-railway, deploy-vercel]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Send notification
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"Zenith Platform deployed successfully!"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

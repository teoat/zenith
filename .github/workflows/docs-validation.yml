name: Documentation Validation

on:
  push:
    paths:
      - 'docs/**'
      - 'backend/app/routers/**'
      - 'backend/app/models/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'backend/app/routers/**'
      - 'backend/app/models/**'

jobs:
  docs-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Generate API documentation
        run: |
          python scripts/documentation/scan_api_endpoints.py
      
      - name: Validate documentation
        run: |
          python scripts/documentation/validate_docs.py
      
      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: validation-report
          path: scripts/documentation/validation_reports/
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = './scripts/documentation/validation_reports';
            
            if (fs.existsSync(path)) {
              const files = fs.readdirSync(path);
              const reportFile = files.find(f => f.endsWith('.json'));
              
              if (reportFile) {
                const report = JSON.parse(fs.readFileSync(`${path}/${reportFile}`, 'utf8'));
                const summary = report.summary;
                
                const comment = `
                ## Documentation Validation Results
                
                **Status**: ${summary.status}
                **Total Issues**: ${summary.total_issues}
                **Errors**: ${summary.errors}
                **Warnings**: ${summary.warnings}
                
                ### Statistics
                - Files Checked: ${summary.files_checked}
                - Links Checked: ${summary.links_checked}
                - Broken Links: ${summary.broken_links}
                - API Endpoints Validated: ${summary.api_endpoints_validated}
                
                ${summary.errors > 0 ? '❌ **Validation Failed** - Please fix documentation issues before merging.' : '✅ **Validation Passed** - Documentation is ready to merge.'}
                `;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            }
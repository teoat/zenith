name: Security Scan

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        npm ci
        cd backend && python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Comprehensive security scanning
    - name: Run npm audit
      run: |
        npm audit --audit-level high --production
        npm audit --audit-level moderate --production || true

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --file=package.json

    - name: Run Python safety check
      run: |
        pip install safety
        safety check --full-report --output json || true

    - name: Run Bandit security linter
      run: |
        pip install bandit
        cd backend
        bandit -r . -f json -o bandit-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30

    - name: Security scan summary
      run: |
        echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "- NPM Audit: $(npm audit --audit-level high --production --json | jq '.metadata.vulnerabilities.total // 0')" >> $GITHUB_STEP_SUMMARY
        echo "- Python Safety: $(safety check --full-report | grep -c "vulnerability" || echo "0")" >> $GITHUB_STEP_SUMMARY
        echo "- Bandit Issues: $(cat backend/bandit-report.json | jq '.results.total_files // 0' 2>/dev/null || echo "0")" >> $GITHUB_STEP_SUMMARY
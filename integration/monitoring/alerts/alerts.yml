groups:
  - name: zenith.alerts
    rules:
      # Service health alerts
      - alert: ServiceDown
        expr: up{job=~".*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 5 minutes"

      # API performance alerts
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API response time on {{ $labels.job }}"
          description: "95th percentile response time > 2s for 10 minutes"

      # Database alerts
      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count{datname="zenith"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connection count"
          description: "Database has >80 active connections"

      # AI/ML alerts
      - alert: AIModelFailure
        expr: rate(ai_inference_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AI model inference failures"
          description: "AI service has >5 errors per minute"

      # Fraud detection alerts
      - alert: FraudDetectionFailure
        expr: rate(fraud_detection_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fraud detection system failure"
          description: "Fraud detection has >10 errors per minute"

      # System resource alerts
      - alert: HighCPUUsage
        expr: rate(cpu_usage_percent[5m]) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage >90% for 10 minutes"

      - alert: HighMemoryUsage
        expr: memory_usage_percent > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage >90%"

      - alert: DiskSpaceLow
        expr: disk_free_percent < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space <10% available"
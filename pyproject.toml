[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | \.venv
  | venv
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["backend", "core", "services", "scripts"]
skip = ["__init__.py", ".venv", "node_modules", ".git"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-platform"
version = "1.0.0"
description = "Advanced fraud detection platform with AI/ML capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core web framework and API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    # Database and ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Authentication and security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Data processing and ML
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "thefuzz>=0.22.1",
    # Image processing and OCR
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
    "PyMuPDF>=1.23.0",
    # External services
    "redis>=5.0.0",
    # Monitoring and observability
    "prometheus-client>=0.19.0",
    "sentry-sdk>=1.40.0",
    "psutil>=5.9.0",
    # Networking and async
    "httpx>=0.27.0",
    # Utilities
    "email-validator>=2.0.0",
    "slowapi>=0.1.8",
    "networkx>=3.0",
    "python-louvain>=0.16"
]

[project.optional-dependencies]
dev = [
    # Testing framework
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.14.0",
    # Test utilities
    "httpx>=0.27.0",
    "coverage>=7.0.0",
    # Code quality and formatting
    "black>=24.3.0",
    "isort>=5.12.0",
    "flake8>=7.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "tox>=3.28.0",
    # Security scanning
    "bandit>=1.7.0",
    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    # Development tools
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "notebook>=7.0.0",
    # Database development
    "sqlite-utils>=3.35",
    # API testing
    "requests>=2.31.0",
    # Performance testing
    "locust>=2.15.0",
    # Container development
    "docker-compose>=1.29.0",
    # Environment management
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "core*", "services*", "scripts*"]
exclude = ["tests*", "docs*", "frontend*", "infrastructure*", "monitoring*"]
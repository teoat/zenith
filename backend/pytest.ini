[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=app --cov-report=html --cov-report=term --cov-fail-under=80 --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
env =
    SECRET_KEY=test_secret_key_for_testing_only_not_for_production
    ENCRYPTION_KEY=test_encryption_key_for_testing_only_not_for_production
    FIELD_ENCRYPTION_KEY=test_field_encryption_key_for_testing_only_not_for_production
    DATABASE_URL=sqlite:///:memory:
    REDIS_URL=redis://localhost:6379/1
    LOG_LEVEL=WARNING
    TESTING=True